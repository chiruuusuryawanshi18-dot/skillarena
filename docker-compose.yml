version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillarena
      POSTGRES_PASSWORD: skillarena
      POSTGRES_DB: skillarena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillarena"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://skillarena:skillarena@postgres:5432/skillarena
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key
      JWT_EXPIRE: 24h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api/src:/app/services/api/src
    command: npm run start:dev

  socket:
    build:
      context: .
      dockerfile: docker/socket.Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      SOCKET_PORT: 3002
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/socket/src:/app/services/socket/src

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3002
    depends_on:
      - api
      - socket
    volumes:
      - ./apps/web/src:/app/apps/web/src

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    ports:
      - "3003:3003"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    volumes:
      - ./apps/admin/src:/app/apps/admin/src

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: skillarena-network
